[package]
name = "sworker"
version = "2.0.0"
authors = ["cyl3x <cyl3x@posteo.de>"]
edition = "2024"
repository = "https://github.com/cyl3x/sworker"
description = "Workspace utility and manager for sway"
license-file = "LICENSE"
readme = "README.md"
keywords = ["sway", "workspace"]

[[bin]]
name = "sworker"
path = "src/main.rs"

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
strip = "debuginfo"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
swayipc = "4.0.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every public function fails for the same reason: the sway IPC connection broke.
missing_errors_doc = "allow"
